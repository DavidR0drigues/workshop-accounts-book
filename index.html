<head>

<title>Livro de Contas – Oficina</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--green:#30363a;--green2:#59686d;--paper:#e8e5dc;--line:#c6c2b8;--ink:#202923;--red:#a12d2d;--accent:#9a552c;--accent-hover:#b56b35;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:var(--green);color:#fff;padding:1rem clamp(1rem,4vw,3rem)}h1,h2,h3{font-family:Georgia,"Times New Roman",serif}h1{font-size:clamp(1.5rem,3vw,2.2rem);margin:.1rem 0}.top{max-width:1500px;margin:auto;display:flex;align-items:center;gap:1rem;justify-content:space-between;flex-wrap:wrap}.search{background:#fff;color:var(--ink);border-radius:8px;padding:.45rem .75rem;display:flex;gap:.5rem;flex:1;min-width:min(100%,350px);max-width:650px}.search input{border:0;outline:0;font:inherit;width:100%}main{max-width:1500px;margin:auto;padding:1.25rem clamp(.75rem,3vw,2rem) 6rem}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}.actions{display:flex;gap:.5rem;flex-wrap:wrap}button,.button,select,input{font:inherit}button,.button{background:var(--green);color:white;border:1px solid var(--green);border-radius:6px;padding:.65rem .9rem;cursor:pointer;font-weight:650}button:hover,.button:hover{background:var(--green2)}#newBtn{background:var(--accent);border-color:var(--accent)}#newBtn:hover{background:var(--accent-hover)}button.secondary{background:#fff;color:var(--green)}button.danger{background:var(--red);border-color:var(--red)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd7131;outline-offset:2px}.year{padding:.55rem;border:1px solid #8e918d;border-radius:5px;background:white}.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--green);gap:.2rem}.tabs button{border-radius:6px 6px 0 0;white-space:nowrap;background:#dedbd2;color:#30363a;border:1px solid #a8a49a}.tabs button[aria-selected=true]{background:var(--green);color:#fff}.panel{padding-top:1rem}.scroll{overflow:auto;border:1px solid #bac5b7;background:#f7f5ef;border-radius:6px}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{text-align:left;padding:.65rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}th{background:#d9d6cc;color:#30363a;position:sticky;top:0}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.mark-paid{width:2.5rem;height:2.5rem;padding:0;border-radius:50%;font-size:1.25rem;line-height:1;background:#fff;color:var(--green);border:2px solid var(--green2)}.mark-paid:hover{background:#e8e2d4}.mark-paid.is-paid{background:var(--green2);color:#fff}.mark-paid:disabled{background:var(--green2);color:#fff;cursor:default;opacity:1}.state{font-weight:700;color:var(--green2)}.debt{color:var(--red)!important;font-weight:700}.empty{background:#fff;padding:2rem;text-align:center;border:1px dashed #a8a49a;border-radius:6px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.7rem;margin-top:1.2rem}.metric{border:1px solid var(--line);background:#f7f5ef;padding:.8rem;border-radius:6px}.metric span{display:block;color:#565d5f;font-size:.92rem}.metric strong{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums;margin-top:.2rem}.double{border-bottom:3px double var(--green);padding-bottom:.15rem}.vehicle{background:#fff;border:1px solid var(--line);border-radius:7px;margin:1rem 0;padding:1rem}.vehicle h3{margin:.1rem 0}.visits{margin-top:.8rem}.visits table{min-width:760px}.backupbar{position:fixed;bottom:0;left:0;right:0;background:var(--green);color:white;padding:.65rem 1rem;text-align:center;z-index:3}.backupbar.warn{background:var(--red)}dialog{border:0;border-radius:10px;box-shadow:0 10px 50px #0005;width:min(960px,96vw);max-height:92vh;padding:0}dialog::backdrop{background:#17201ccc}.modalhead,.modalfoot{padding:1rem 1.25rem;background:#e4e9df;display:flex;justify-content:space-between;align-items:center;gap:.75rem}.modalhead h2{margin:0}.modalbody{padding:1rem 1.25rem;overflow:auto;max-height:calc(92vh - 150px)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}.field{display:flex;flex-direction:column;gap:.25rem}.field label{font-weight:650}.field input{padding:.55rem;border:1px solid #929f93;border-radius:5px;min-width:0}.line-table{min-width:670px}.line-table input{width:100%;padding:.4rem;border:1px solid #a4aea2;border-radius:4px}.line-table td{padding:.35rem}.line-table .qty{width:90px}.line-table .money{width:125px}.calc{display:flex;justify-content:flex-end;gap:1rem;flex-wrap:wrap;margin:1rem 0;font-weight:700}.notice{padding:.65rem;background:#e8e2d4;color:#234a39;border-radius:5px;margin:.7rem 0}.error{color:var(--red);font-weight:700}.annual-bar{height:12px;background:#dedbd2;border-radius:10px;min-width:150px}.annual-bar i{height:100%;display:block;background:var(--green2);border-radius:10px}.small{font-size:.9rem;color:#526055}@media(max-width:700px){.fields{grid-template-columns:1fr 1fr}body{font-size:16px}.toolbar{align-items:flex-start}}@media(max-width:460px){.fields{grid-template-columns:1fr}.actions button{flex:1}}
</style>
</head>
<body>
<header><div class="top"><div><h1>Livro de Contas – Oficina</h1><div>Registo de intervenções, faturas e pagamentos</div></div><label class="search" aria-label="Pesquisar por matrícula ou cliente"><span>⌕</span><input id="search" type="search" placeholder="Pesquisar matrícula ou cliente…" autocomplete="off"></label></div></header>
<main><div class="toolbar"><div><label for="year">Ano </label><select id="year" class="year"></select></div><div class="actions"><button id="newBtn">＋ Nova intervenção</button><button id="chooseBackup" class="secondary">Escolher pasta de backup</button><button id="backupNow" class="secondary">Guardar backup agora</button><button id="exportBtn" class="secondary">Exportar</button><button id="importBtn" class="secondary">Importar</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></div>
<nav class="tabs" id="tabs" aria-label="Meses"></nav><section class="panel" id="content" aria-live="polite"></section></main>
<div id="backupBar" class="backupbar"></div>
<dialog id="editor"><form id="recordForm"><div class="modalhead"><h2 id="formTitle">Nova intervenção</h2><button type="button" class="secondary" id="closeDialog" aria-label="Fechar">Fechar</button></div><div class="modalbody"><input type="hidden" id="recordId"><div class="fields"><div class="field"><label for="client">Cliente *</label><input id="client" required maxlength="160"></div><div class="field"><label for="plate">Matrícula *</label><input id="plate" required maxlength="20" autocomplete="off"></div><div class="field"><label for="brand">Marca</label><input id="brand" maxlength="80"></div><div class="field"><label for="model">Modelo</label><input id="model" maxlength="100"></div><div class="field"><label for="serviceDate">Data do serviço *</label><input id="serviceDate" type="date" required></div><div class="field"><label for="invoice">N.º da fatura</label><input id="invoice" maxlength="80"></div></div><div id="plateNotice" class="notice" hidden></div><h3>Peças e serviços</h3><div class="scroll"><table class="line-table"><thead><tr><th>Descrição</th><th>Quantidade</th><th>Valor (€)</th><th class="num">Total da linha</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><button type="button" id="addLine" class="secondary" style="margin-top:.6rem">＋ Linha</button><div class="fields" style="margin-top:1rem"><div class="field"><label for="paid">Valor já pago (€)</label><input id="paid" type="number" min="0" step="0.01" value="0"></div></div><div class="calc"><span>Total: <b id="totalCalc" class="double">0,00 €</b></span><span>Em dívida: <b id="debtCalc">0,00 €</b></span><span>Estado: <b id="stateCalc">Pago</b></span></div><div id="formError" class="error" role="alert"></div></div><div class="modalfoot"><span class="small">As linhas completamente vazias não são guardadas.</span><button type="submit">Guardar registo</button></div></form></dialog>
<script>
(()=>{'use strict';
const DB_NAME='livro-contas-oficina',STORE='records',META='meta',MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const $=id=>document.getElementById(id), euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(cents(n)/100), cents=n=>Math.round((Number(n)||0)*100), norm=s=>String(s||'').toUpperCase().replace(/[\s-]/g,''), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let db,records=[],viewMonth=new Date().getMonth(),view='month',year=new Date().getFullYear(),backupHandle=null,backupTimer;
function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(META))d.createObjectStore(META)};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){records=await reqP(db.transaction(STORE).objectStore(STORE).getAll());backupHandle=await reqP(db.transaction(META).objectStore(META).get('backupHandle'))||null;render();refreshBackupBar()}
function put(record){return reqP(db.transaction(STORE,'readwrite').objectStore(STORE).put(record))}function deleteRecord(id){return reqP(db.transaction(STORE,'readwrite').objectStore(STORE).delete(id))}
const total=r=>(r.lines||[]).reduce((s,l)=>s+cents(l.qty*l.unit)/100,0),paid=r=>Math.max(0,cents(r.paid)/100),debt=r=>Math.max(0,Math.round((total(r)-paid(r))*100)/100),state=r=>debt(r)===0?'Pago':'Pendente';
function stats(list){const keys=new Set(list.map(r=>norm(r.plate)));return {clients:new Set(list.map(r=>r.client.trim().toLocaleLowerCase('pt-PT'))).size,vehicles:keys.size,billed:list.reduce((s,r)=>s+total(r),0),received:list.reduce((s,r)=>s+paid(r),0),due:list.reduce((s,r)=>s+debt(r),0)}}
function metric(label,value,red=false){return `<div class="metric"><span>${label}</span><strong class="${red?'debt':''}">${value}</strong></div>`}
function summary(s){return `<div class="summary">${metric('Clientes distintos',s.clients)}${metric('Veículos intervencionados',s.vehicles)}${metric('Total faturado',euro(s.billed))}${metric('Total recebido',euro(s.received))}${metric('Total por receber',euro(s.due),s.due>0)}</div>`}
function tableRows(list){if(!list.length)return '<div class="empty"><h2>Sem registos neste mês</h2><p>Crie a primeira intervenção para começar o livro de contas.</p><button onclick="document.getElementById(\'newBtn\').click()">＋ Nova intervenção</button></div>';list.sort((a,b)=>a.date.localeCompare(b.date));return `<div class="scroll"><table><thead><tr><th>Data</th><th>Cliente</th><th>Veículo</th><th>Matrícula</th><th>N.º fatura</th><th class="num">Total</th><th class="num">Pago</th><th class="num">Em dívida</th><th>Estado</th><th>Ações</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(datePT(r.date))}</td><td>${esc(r.client)}</td><td>${esc([r.brand,r.model].filter(Boolean).join(' '))}</td><td>${esc(r.plate)}</td><td>${esc(r.invoice||'—')}</td><td class="num">${euro(total(r))}</td><td class="num">${euro(paid(r))}</td><td class="num ${debt(r)>0?'debt':''}">${euro(debt(r))}</td><td class="${debt(r)>0?'debt':'state'}">${state(r)}</td><td><button class="secondary" onclick="editRecord('${esc(r.id)}')">Editar</button> <button class="danger" onclick="removeRecord('${esc(r.id)}')">Eliminar</button> <button type="button" class="mark-paid ${debt(r)===0?"is-paid":""}" data-paid="${esc(r.id)}" aria-label="${debt(r)===0?'Desmarcar pagamento':'Marcar como paga'}" title="${debt(r)===0?'Desmarcar pagamento':'Marcar como paga'}">✓</button></td></tr>`).join('')}</tbody></table></div>`}
function datePT(d){if(!d)return '';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function render(){const tabs=$('tabs');tabs.innerHTML=MONTHS.map((m,i)=>`<button role="tab" aria-selected="${view==='month'&&viewMonth===i}" onclick="showMonth(${i})">${m}</button>`).join('')+`<button role="tab" aria-selected="${view==='annual'}" onclick="showAnnual()">Resumo anual</button>`;const list=records.filter(r=>r.date.startsWith(String(year))&&(view==='annual'||Number(r.date.slice(5,7))===viewMonth+1));$('content').innerHTML=view==='annual'?annual(list):`<h2>${MONTHS[viewMonth]} ${year}</h2>${tableRows(list)}<h2>Resumo mensal</h2>${summary(stats(list))}`}
function showMonth(i){viewMonth=i;view='month';render()}function showAnnual(){view='annual';render()}window.showMonth=showMonth;window.showAnnual=showAnnual;
function annual(list){const monthly=MONTHS.map((name,i)=>{const s=stats(list.filter(r=>Number(r.date.slice(5,7))===i+1));return {name,...s}}),max=Math.max(1,...monthly.map(x=>x.billed));return `<h2>Resumo anual ${year}</h2>${summary(stats(list))}<h3>Movimento por mês</h3><div class="scroll"><table><thead><tr><th>Mês</th><th class="num">Faturado</th><th class="num">Recebido</th><th class="num">Por receber</th><th>Faturação relativa</th></tr></thead><tbody>${monthly.map(m=>`<tr><td>${m.name}</td><td class="num">${euro(m.billed)}</td><td class="num">${euro(m.received)}</td><td class="num ${m.due>0?'debt':''}">${euro(m.due)}</td><td><div class="annual-bar" aria-label="${Math.round(m.billed/max*100)}%"><i style="width:${Math.round(m.billed/max*100)}%"></i></div></td></tr>`).join('')}<tr><th>Total do ano</th><th class="num">${euro(stats(list).billed)}</th><th class="num">${euro(stats(list).received)}</th><th class="num ${stats(list).due>0?'debt':''}">${euro(stats(list).due)}</th><th></th></tr></tbody></table></div>`}
function initYear(){const s=$('year');const current=new Date().getFullYear();for(let y=current-10;y<=current+5;y++){const o=document.createElement('option');o.value=y;o.textContent=y;s.append(o)}s.value=year;s.onchange=()=>{year=Number(s.value);render()}}
function addLine(desc='',qty='',unit=''){const tr=document.createElement('tr');tr.innerHTML=`<td><input aria-label="Descrição" class="desc" maxlength="200" value="${esc(desc)}"></td><td><input aria-label="Quantidade" class="qty" type="number" min="0" step="0.01" value="${esc(qty)}"></td><td><input aria-label="Valor unitário em euros" class="money" type="number" min="0" step="0.01" value="${esc(unit)}"></td><td class="num lineTotal">0,00 €</td><td><button type="button" class="secondary delLine" aria-label="Remover linha">×</button></td>`;$('lines').append(tr);tr.querySelectorAll('input').forEach(el=>el.addEventListener('input',calcForm));tr.querySelector('.delLine').onclick=()=>{tr.remove();calcForm()};calcForm()}
function calcForm(){let sum=0;document.querySelectorAll('#lines tr').forEach(tr=>{const q=Number(tr.querySelector('.qty').value)||0,u=Number(tr.querySelector('.money').value)||0,v=Math.round(q*cents(u))/100;sum+=v;tr.querySelector('.lineTotal').textContent=euro(v)});sum=Math.round(sum*100)/100;const p=Math.min(sum,Math.max(0,Number($('paid').value)||0)),d=Math.max(0,Math.round((sum-p)*100)/100);$('totalCalc').textContent=euro(sum);$('debtCalc').textContent=euro(d);$('debtCalc').className=d>0?'debt':'';$('stateCalc').textContent=d?'Pendente':'Pago'}
function clearForm(){ $('recordForm').reset();$('recordId').value='';$('paid').value='0';$('serviceDate').value=today();$('formError').textContent='';$('plateNotice').hidden=true;$('lines').innerHTML='';addLine();$('formTitle').textContent='Nova intervenção';}
function openEditor(record=null,prefill=null){clearForm();if(record){$('formTitle').textContent='Editar intervenção';$('recordId').value=record.id;$('client').value=record.client;$('plate').value=record.plate;$('brand').value=record.brand||'';$('model').value=record.model||'';$('serviceDate').value=record.date;$('invoice').value=record.invoice||'';$('paid').value=(cents(record.paid)/100).toFixed(2);$('lines').innerHTML='';record.lines.forEach(l=>addLine(l.description,l.qty,(cents(l.unit)/100).toFixed(2)))}else if(prefill){$('plate').value=prefill.plate;$('client').value=prefill.client;$('brand').value=prefill.brand||'';$('model').value=prefill.model||''}calcForm();$('editor').showModal();$('client').focus()}
window.editRecord=id=>{const r=records.find(x=>x.id===id);if(r)openEditor(r)};$('content').addEventListener('click',async e=>{const b=e.target.closest('[data-paid]');if(!b)return;const r=records.find(x=>x.id===b.dataset.paid);if(!r)return;r.paid=debt(r)>0?Math.round((paid(r)+debt(r))*100)/100:0;await put(r);await load();scheduleBackup()});window.removeRecord=async id=>{const r=records.find(x=>x.id===id);if(r&&confirm(`Eliminar o registo de ${r.client} (${r.plate})? Esta ação não pode ser desfeita.`)){await deleteRecord(id);await load();scheduleBackup()}};
$('newBtn').onclick=()=>openEditor();$('closeDialog').onclick=()=>$('editor').close();$('addLine').onclick=()=>addLine();$('paid').oninput=calcForm;
$('plate').addEventListener('input',()=>{const key=norm($('plate').value),matches=records.filter(r=>norm(r.plate)===key);if(matches.length){const latest=matches.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];if(!$('client').value)$('client').value=latest.client;if(!$('brand').value)$('brand').value=latest.brand||'';if(!$('model').value)$('model').value=latest.model||'';$('plateNotice').textContent=`Veículo já registado: ${matches.length} ${matches.length===1?'visita anterior':'visitas anteriores'}. Esta fica no mesmo histórico.`;$('plateNotice').hidden=false}else $('plateNotice').hidden=true});
$('recordForm').onsubmit=async e=>{e.preventDefault();const oldId=$('recordId').value,lines=[];document.querySelectorAll('#lines tr').forEach(tr=>{const description=tr.querySelector('.desc').value.trim(),qty=Number(tr.querySelector('.qty').value)||0,unit=Number(tr.querySelector('.money').value)||0;if(description||qty||unit){if(!description){$('formError').textContent='Indique uma descrição para cada linha preenchida.';return}lines.push({description,qty,unit:Math.round(unit*100)/100})}});if($('formError').textContent)return;const r={id:oldId||crypto.randomUUID(),client:$('client').value.trim(),plate:$('plate').value.trim().toUpperCase(),brand:$('brand').value.trim(),model:$('model').value.trim(),date:$('serviceDate').value,invoice:$('invoice').value.trim(),lines,paid:Math.round((Number($('paid').value)||0)*100)/100};if(!r.client||!r.plate||!r.date){$('formError').textContent='Cliente, matrícula e data são obrigatórios.';return}await put(r);await load();year=Number(r.date.slice(0,4));$('year').value=year;viewMonth=Number(r.date.slice(5,7))-1;view='month';render();$('editor').close();scheduleBackup()};
$('search').addEventListener('input',e=>{const q=e.target.value.trim();if(!q){if($('searchResults'))$('searchResults').remove();return}view='search';render();const key=norm(q),found=records.filter(r=>norm(r.plate).includes(key)||r.client.toLocaleLowerCase('pt-PT').includes(q.toLocaleLowerCase('pt-PT'))),groups=new Map();found.forEach(r=>{const k=norm(r.plate);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});$('content').innerHTML=`<h2>Resultados da pesquisa</h2>${groups.size?Array.from(groups.values()).map(g=>{g.sort((a,b)=>b.date.localeCompare(a.date));const last=g[0],s=stats(g);return `<article class="vehicle"><h3>${esc(last.plate)} · ${esc([last.brand,last.model].filter(Boolean).join(' '))}</h3><p>Proprietário: ${esc(last.client)} · ${g.length} ${g.length===1?'visita':'visitas'} · Total faturado ${euro(s.billed)} · Por receber <span class="${s.due>0?'debt':''}">${euro(s.due)}</span></p><button onclick="newForVehicle('${esc(last.id)}')">＋ Nova intervenção neste veículo</button><div class="visits scroll"><table><thead><tr><th>Data</th><th>Fatura</th><th>Total</th><th>Pago</th><th>Estado</th><th>Peças e serviços</th><th></th></tr></thead><tbody>${g.map(r=>`<tr><td>${esc(datePT(r.date))}</td><td>${esc(r.invoice||'—')}</td><td class="num">${euro(total(r))}</td><td class="num">${euro(paid(r))}</td><td class="${debt(r)>0?'debt':'state'}">${state(r)}</td><td>${r.lines.map(l=>`${esc(l.description)} · ${esc(l.qty)} × ${euro(l.unit)}`).join('<br>')||'—'}</td><td><button class="secondary" onclick="editRecord('${esc(r.id)}')">Editar</button></td></tr>`).join('')}</tbody></table></div></article>`}).join(''):'<div class="empty">Sem resultados. Pesquise por parte da matrícula (com ou sem espaços/hífenes) ou pelo nome do cliente.</div>'}`});window.newForVehicle=id=>{const r=records.find(x=>x.id===id);if(r)openEditor(null,r)};
function exportData(){return {app:'Livro de Contas – Oficina',version:1,exportedAt:new Date().toISOString(),records}}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('exportBtn').onclick=()=>download(exportData(),'livro-de-contas-backup.json');$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.records)||!data.records.every(r=>r&&typeof r.id==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(r.id)&&typeof r.client==='string'&&typeof r.plate==='string'&&/^\d{4}-\d\d-\d\d$/.test(r.date)&&Number.isFinite(Number(r.paid))&&Number(r.paid)>=0&&Array.isArray(r.lines)&&r.lines.every(l=>l&&typeof l.description==='string'&&Number.isFinite(Number(l.qty))&&Number(l.qty)>=0&&Number.isFinite(Number(l.unit))&&Number(l.unit)>=0)))throw Error('formato');if(!confirm(`Importar ${data.records.length} registos? Os registos com o mesmo ID serão atualizados; os restantes serão mantidos.`))return;for(const r of data.records)await put(r);await load();scheduleBackup();alert('Importação concluída.')}catch(err){alert('Não foi possível importar: ficheiro JSON inválido ou incompatível.')}finally{e.target.value=''}};
async function persistHandle(handle){backupHandle=handle;await reqP(db.transaction(META,'readwrite').objectStore(META).put(handle,'backupHandle'))}
async function writeBackup(){if(!backupHandle)return false;try{let p=await backupHandle.queryPermission({mode:'readwrite'});if(p!=='granted')p=await backupHandle.requestPermission({mode:'readwrite'});if(p!=='granted')return false;const w=await backupHandle.getFileHandle('livro-de-contas-backup.json',{create:true}),stream=await w.createWritable();await stream.write(JSON.stringify(exportData(),null,2));await stream.close();await reqP(db.transaction(META,'readwrite').objectStore(META).put(Date.now(),'lastBackup'));refreshBackupBar();return true}catch(e){console.warn('Backup indisponível',e);refreshBackupBar();return false}}
function scheduleBackup(){clearTimeout(backupTimer);backupTimer=setTimeout(writeBackup,1200)}$('chooseBackup').onclick=async()=>{if(!window.showDirectoryPicker){alert('A escolha de pasta não está disponível neste navegador. Use Exportar para guardar uma cópia.');return}try{const handle=await showDirectoryPicker({mode:'readwrite'});await persistHandle(handle);if(await writeBackup())alert('Pasta de backup configurada e cópia guardada.');else alert('Pasta guardada, mas não foi possível escrever. Use Guardar backup agora para autorizar o acesso.')}catch(e){if(e.name!=='AbortError')alert('Não foi possível escolher a pasta de backup.')}};$('backupNow').onclick=async()=>{if(!backupHandle){$('chooseBackup').click();return}if(await writeBackup())alert('Backup guardado com sucesso.');else alert('Acesso ao backup pendente. Escolha novamente a pasta para reativar a permissão.')};
async function refreshBackupBar(){const last=await reqP(db.transaction(META).objectStore(META).get('lastBackup'));const days=last?Math.floor((Date.now()-last)/86400000):null;const bar=$('backupBar');bar.classList.toggle('warn',days===null||days>7);bar.textContent=days===null?'Nunca foi feito um backup. Faça uma cópia hoje.':`Último backup há ${days} ${days===1?'dia':'dias'}.${days>7?' Faça uma cópia hoje.':''}`}
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker indisponível',e)));
async function start(){try{db=await openDB();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});initYear();await load()}catch(e){document.body.innerHTML='<main><h1>Não foi possível abrir o livro de contas</h1><p>Este navegador não conseguiu iniciar o armazenamento local (IndexedDB).</p></main>'}}start();
})();
</script>
